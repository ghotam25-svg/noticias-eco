name: Noticias económicas
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python noticias.py
        env:
          PUBLISHED_JSON_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
